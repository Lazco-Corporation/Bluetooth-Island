name: Bluetooth-Island
options:
  bundleIdPrefix: com.lazco
  deploymentTarget:
    iOS: "16.2"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  SWIFT_VERSION: 5.9
  CURRENT_PROJECT_VERSION: 1
  MARKETING_VERSION: 1.0

targets:
  Bluetooth-Island:
    type: application
    platform: iOS
    sources:
      - path: Bluetooth-Island
        excludes:
          - "*.md"
        type: group
        createIntermediateGroups: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lazco.BluetoothIsland
      INFOPLIST_FILE: Bluetooth-Island/Info.plist
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: 1
      SWIFT_VERSION: 5.9
      ENABLE_PREVIEWS: YES
    dependencies:
      - target: BluetoothIslandWidget
    info:
      path: Bluetooth-Island/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Bluetooth Island
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientationsiPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Live Activities Support
        NSSupportsLiveActivities: true
        # Notification Permission (optional - only if user chooses Notification type)
        NSUserNotificationsUsageDescription: "Show device connection notifications when triggered by Shortcuts automation"
    entitlements:
      path: Bluetooth-Island/Bluetooth-Island.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lazco.BluetoothIsland

  BluetoothIslandWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BluetoothIslandWidget
        excludes:
          - "*.md"
      # Shared files between app and widget
      - path: Bluetooth-Island/Models/BluetoothActivityAttributes.swift
      - path: Bluetooth-Island/Shared/Constants.swift
      - path: Bluetooth-Island/Shared/DeviceIconMapper.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lazco.BluetoothIsland.BluetoothIslandWidget
      INFOPLIST_FILE: BluetoothIslandWidget/Info.plist
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: 1
      SWIFT_VERSION: 5.9
      ENABLE_PREVIEWS: YES
    info:
      path: BluetoothIslandWidget/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: BluetoothIslandWidget
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BluetoothIslandWidget/BluetoothIslandWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lazco.BluetoothIsland

schemes:
  Bluetooth-Island:
    build:
      targets:
        Bluetooth-Island: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
